name: CinePulse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinepulse-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: cinepulse-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & regression test suite
        run: npm test

      - name: Install Playwright browsers & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright accessibility & browser tests
        run: npm run test:browser
