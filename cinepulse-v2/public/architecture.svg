<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18232c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f161c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55c29b"/>
      <stop offset="100%" stop-color="#b3f3d5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#0b0e12" rx="16"/>
  <rect x="1" y="1" width="958" height="478" fill="none" stroke="#222d36" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="480" y="44" fill="#f4f6f5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="-0.5">CinePulse Architecture &amp; Data Flow</text>
  <text x="480" y="68" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Local-First Prediction Engine &amp; Social Platform</text>

  <!-- Node 1: Client UI Layer -->
  <g transform="translate(40, 110)" filter="url(#glow)">
    <rect width="200" height="300" rx="12" fill="url(#cardGrad)" stroke="#2d3f4c" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="4" fill="url(#accentGrad)" rx="2"/>
    <text x="100" y="34" fill="#b3f3d5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Frontend Client</text>
    <text x="100" y="52" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Next.js 16 + React 19</text>
    <line x1="20" y1="68" x2="180" y2="68" stroke="#222d36" stroke-width="1"/>
    
    <text x="24" y="96" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Modular Hooks (useAuth, useLibrary)</text>
    <text x="24" y="122" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Discovery &amp; Taste DNA</text>
    <text x="24" y="148" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Movie Room &amp; Score Card</text>
    <text x="24" y="174" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Contrarian Desk &amp; Waterfall</text>
    <text x="24" y="200" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Movie Night &amp; Circles</text>
    <text x="24" y="226" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• 5-Dest Mobile Bottom Nav</text>
    <text x="24" y="252" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• WCAG AA Accessible (Axe)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 240 L 285 240" stroke="#55c29b" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="285,236 295,240 285,244" fill="#55c29b"/>

  <!-- Node 2: API & Dispatcher Layer -->
  <g transform="translate(295, 110)" filter="url(#glow)">
    <rect width="180" height="300" rx="12" fill="url(#cardGrad)" stroke="#2d3f4c" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" fill="url(#accentGrad)" rx="2"/>
    <text x="90" y="34" fill="#b3f3d5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">API Dispatcher</text>
    <text x="90" y="52" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">app/api/[...path]/route.ts</text>
    <line x1="20" y1="68" x2="160" y2="68" stroke="#222d36" stroke-width="1"/>
    
    <text x="20" y="96" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Origin Enforcement</text>
    <text x="20" y="122" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• JWT &amp; Cookie Sessions</text>
    <text x="20" y="148" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Catalog &amp; Health Checks</text>
    <text x="20" y="174" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Social Visibility Gate</text>
    <text x="20" y="200" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Analytics Telemetry</text>
    <text x="20" y="226" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Movie Night Sessions</text>
    <text x="20" y="252" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Circles &amp; Shared Voting</text>
  </g>

  <!-- Arrow 2 -> 3 (External) & Arrow 2 -> 4 (DB) -->
  <path d="M 475 190 L 530 190" stroke="#55c29b" stroke-width="2"/>
  <polygon points="530,186 540,190 530,194" fill="#55c29b"/>

  <path d="M 475 310 L 530 310" stroke="#55c29b" stroke-width="2"/>
  <polygon points="530,306 540,310 530,314" fill="#55c29b"/>

  <!-- Node 3: Data Fetchers & Cache -->
  <g transform="translate(540, 95)" filter="url(#glow)">
    <rect width="180" height="150" rx="12" fill="url(#cardGrad)" stroke="#2d3f4c" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" fill="url(#accentGrad)" rx="2"/>
    <text x="90" y="28" fill="#b3f3d5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fetchers &amp; Cache</text>
    <text x="90" y="44" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">lib/fetchers &amp; api_cache</text>
    <line x1="16" y1="56" x2="164" y2="56" stroke="#222d36" stroke-width="1"/>
    <text x="20" y="80" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• TMDB v3 API (30d cache)</text>
    <text x="20" y="102" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Wikipedia Pageviews</text>
    <text x="20" y="124" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• YouTube Trailer Velocity</text>
    <text x="20" y="142" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• Gemini Summarizer</text>
  </g>

  <!-- Node 4: Database & Storage Engine -->
  <g transform="translate(540, 265)" filter="url(#glow)">
    <rect width="180" height="160" rx="12" fill="url(#cardGrad)" stroke="#2d3f4c" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" fill="url(#accentGrad)" rx="2"/>
    <text x="90" y="28" fill="#b3f3d5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Database Adapter</text>
    <text x="90" y="44" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">SQLite Sync / Supabase</text>
    <line x1="16" y1="56" x2="164" y2="56" stroke="#222d36" stroke-width="1"/>
    <text x="20" y="80" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• users, sessions, library</text>
    <text x="20" y="100" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• forecasts &amp; forecast_events</text>
    <text x="20" y="120" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• predictions_log (Serve-time)</text>
    <text x="20" y="140" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="11">• analytics_events &amp; circles</text>
  </g>

  <!-- Arrow to Model -->
  <path d="M 720 190 L 765 240" stroke="#55c29b" stroke-width="2"/>
  <path d="M 720 310 L 765 250" stroke="#55c29b" stroke-width="2"/>
  <polygon points="765,240 775,245 765,250" fill="#55c29b"/>

  <!-- Node 5: Prediction ML Model -->
  <g transform="translate(775, 150)" filter="url(#glow)">
    <rect width="145" height="190" rx="12" fill="url(#cardGrad)" stroke="#2d3f4c" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="4" fill="url(#accentGrad)" rx="2"/>
    <text x="72" y="32" fill="#b3f3d5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ML &amp; Taste Engine</text>
    <text x="72" y="48" fill="#8d989f" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">lib/prediction/model.ts</text>
    <line x1="12" y1="60" x2="133" y2="60" stroke="#222d36" stroke-width="1"/>
    <text x="14" y="85" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="10">• 10-Feature Matrix</text>
    <text x="14" y="105" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="10">• Ridge Log-Revenue</text>
    <text x="14" y="125" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="10">• Platt Hit Probability</text>
    <text x="14" y="145" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="10">• P10/P50/P90 Brackets</text>
    <text x="14" y="165" fill="#e0f3ed" font-family="system-ui, sans-serif" font-size="10">• Brier Score Auditing</text>
  </g>
</svg>
