<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <title>You're offline · CinePulse</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(120% 80% at 50% 0%, #12332a 0%, #0b0e12 60%);
      color: #f4f6f5;
      font-family: Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    svg { width: 72px; height: 72px; }
    h1 { margin: 10px 0 0; font-size: 28px; letter-spacing: -0.03em; line-height: 1.15; }
    p { margin: 0; color: #9db0a8; font-size: 15px; line-height: 1.6; }
    a {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 26px;
      border-radius: 999px;
      background: #b3f3d5;
      color: #0f2a1d;
      font-weight: 700;
      text-decoration: none;
    }
    small { color: #6f7d78; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#101b17"/><g fill="#b3f3d5" transform="rotate(-12 32 32)"><rect x="15" y="24" width="8" height="24" rx="4"/><rect x="28" y="12" width="8" height="40" rx="4"/><rect x="41" y="18" width="8" height="31" rx="4"/></g></svg>
    <h1>You're offline</h1>
    <p>CinePulse needs a connection to load films, forecasts and your library. Your saved data is safe on our servers.</p>
    <a href="/">Try again</a>
    <small>This page will work again as soon as you're back online.</small>
  </main>
</body>
</html>
